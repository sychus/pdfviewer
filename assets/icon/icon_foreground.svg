<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Foreground layer for Android adaptive icons.

    Android composites this over a solid background and then applies whatever
    mask the launcher wants — circle, squircle, rounded square, teardrop. Only
    the middle ~66% is guaranteed to survive, and the layer also gets scaled up
    during parallax animations.

    So the page is drawn smaller than in icon.svg and centred, with the whole
    outer third treated as sacrificial. Same shape, more margin.
  -->
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEDF0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3D060B" flood-opacity="0.30"/>
    </filter>
  </defs>

  <g filter="url(#lift)">
    <path d="M378 330 H588 L694 436 V768 Q694 786 676 786 H396 Q378 786 378 768 Z"
          fill="url(#page)"/>
    <path d="M588 330 L694 436 H606 Q588 436 588 418 Z" fill="#C9CBD4"/>
  </g>

  <g fill="#C2C7D2">
    <rect x="434" y="546" width="202" height="20" rx="10"/>
    <rect x="434" y="618" width="202" height="20" rx="10"/>
    <rect x="434" y="690" width="124" height="20" rx="10"/>
  </g>
</svg>
