name: pdfviewer
description: "Lightweight cross-platform PDF viewer"
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  pdfrx: ^2.4.7
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Needed because pdfrx talks to PDFium over FFI: exercising the repository
  # for real requires a running platform, not the pure Dart test VM.
  integration_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true

# App icons are generated from assets/icon/*.svg, not hand-placed.
# Regenerate after editing the SVGs:
#   rsvg-convert -w 1024 -h 1024 assets/icon/icon.svg -o assets/icon/icon.png
#   rsvg-convert -w 1024 -h 1024 assets/icon/icon_foreground.svg -o assets/icon/icon_foreground.png
#   fvm dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # Android composites these two and applies the launcher's own mask, so the
  # foreground carries its own generous margin.
  adaptive_icon_background: "#8C1721"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#8C1721"
    theme_color: "#8C1721"
